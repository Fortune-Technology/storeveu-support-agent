# TEMPLATE — bootstrap-fork.ps1 drops this into the fork as
#            .github/workflows/storeveu-release.yml
# Fork:   https://github.com/Fortune-Technology/storeveu-support-agent  (PUBLIC — AGPL)
# Signing: SSL.com eSigner (cloud HSM) via the official sslcom/esigner-codesign
#
# Toolchain pins below are RustDesk's OWN, taken verbatim from
# rustdesk/rustdesk@1.4.6 .github/workflows/flutter-build.yml (Rust 1.75,
# Flutter 3.24.5, LLVM 15.0.6, vcpkg @120deac3…). This mirrors the exact
# environment upstream tests, which is the single biggest first-run-success
# lever — do NOT bump these without re-reading that upstream workflow.

name: storeveu-release-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # create the Release + attach the signed installer

env:
  # Informational: the upstream source snapshot this fork was bootstrapped
  # from. The actual pin is the imported source on this fork's ref — CI builds
  # THIS repo's content, not an upstream tag (that was the old bug).
  RUSTDESK_REF: "1.4.6"
  SCITER_RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  # AGPL-3.0: refuse to produce a distributable binary unless the corresponding
  # source (this fork) is public. SOURCE_OFFER.md points recipients here.
  agpl-source-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require public source (AGPL-3.0)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          vis=$(gh repo view "$GITHUB_REPOSITORY" --json visibility -q .visibility)
          echo "fork visibility: $vis"
          if [ "$vis" != "PUBLIC" ]; then
            echo "::error::AGPL-3.0: corresponding source must be PUBLIC before release"
            exit 1
          fi

  build:
    needs: agpl-source-gate
    # Pinned to windows-2022 (VS 2022). windows-latest migrated off VS 2019, so
    # Flutter/CMake's "Visual Studio 16 2019" generator could no longer find an
    # instance and `flutter build windows` failed. windows-2022 ships VS 2022 ->
    # Flutter uses the "Visual Studio 17 2022" generator. (Was windows-latest.)
    runs-on: windows-2022
    steps:
      # Build THIS fork's ref (the tag the user pushed) WITH submodules —
      # hbb_common is a submodule in 1.4.x. NO `ref:` override (the old
      # template pinned upstream's 1.4.6 tag, which has none of our files).
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Rust ${{ env.SCITER_RUST_VERSION }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: LLVM ${{ env.LLVM_VERSION }} (choco — ships libclang.dll)
        shell: pwsh
        run: choco install llvm -y --no-progress

      # Cache downloaded crates (registry index + git deps). Saves ~3-5 min
      # per run. target/ is too large to cache effectively on GHA.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: vcpkg (pinned to rustdesk's commit)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Apply Storeveu branding + server pin
        shell: pwsh
        run: ./branding/apply-branding.ps1

      - name: Build RustDesk (Windows / Flutter)
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"

        run: ./build-rustdesk-windows.ps1

      # Code-signing is OPTIONAL. Probe whether all 4 SSL.com eSigner secrets
      # are set and export HAVE_SIGNING; the sign/verify steps below are gated
      # on it. Without secrets the build still publishes an UNSIGNED installer
      # (wire signing in as a fast-follow once the eSigner account is ready).
      - name: Detect signing secrets
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $have = [bool]$env:ES_USERNAME -and [bool]$env:ES_PASSWORD -and [bool]$env:ES_CREDENTIAL_ID -and [bool]$env:ES_TOTP_SECRET
          "HAVE_SIGNING=$($have.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "HAVE_SIGNING=$have"

      # Cloud-HSM EV code-signing — SSL.com eSigner (EV cert never leaves
      # their vault). OPTIONAL: skipped unless all 4 ES_* secrets are set.
      - name: Code-sign (SSL.com eSigner)
        if: env.HAVE_SIGNING == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/dist/StoreveuSupportSetup.exe
          output_path: ${{ github.workspace }}/dist/signed
          malware_block: false
          environment_name: PROD
          override: true

      - name: Verify signature
        if: env.HAVE_SIGNING == 'true'
        shell: pwsh
        run: signtool verify /pa /v dist/signed/StoreveuSupportSetup.exe

      # Pick the signed exe if signing ran, else the unsigned one produced by
      # build-rustdesk-windows.ps1. ARTIFACT/SIGNED feed upload + release.
      - name: Resolve artifact
        shell: pwsh
        run: |
          if (Test-Path dist/signed/StoreveuSupportSetup.exe) {
            $p = 'dist/signed/StoreveuSupportSetup.exe'; $signed = 'true'
          } else {
            $p = 'dist/StoreveuSupportSetup.exe'; $signed = 'false'
          }
          if (-not (Test-Path $p)) { throw "no installer produced ($p)" }
          "ARTIFACT=$p"    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNED=$signed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "artifact=$p signed=$signed"

      - uses: actions/upload-artifact@v4
        with:
          name: storeveu-support-windows
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error

      # On a v* tag, publish a Release so the cashier-app distribution / stores
      # can fetch the installer at a stable URL (signed once eSigner is set up).
      - name: Publish Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}
          name: "Storeveu Support ${{ github.ref_name }}"
          body: |
            Storeveu Support agent (RustDesk ${{ env.RUSTDESK_REF }} base,
            server-pinned to support.storeveu.com:443, relay :80 - the dedicated tunnel-free server).
            Signed: ${{ env.SIGNED }} — unsigned builds are pending SSL.com eSigner setup.
            Corresponding source: this public repository (AGPL-3.0).
          draft: false
          prerelease: false

# Required repo secrets (Settings → Secrets and variables → Actions), all from
# the SSL.com account / eSigner:
#   ES_USERNAME       SSL.com account username
#   ES_PASSWORD       SSL.com account password
#   ES_CREDENTIAL_ID  eSigner credential/cert ID  (SSL.com → eSigner)
#   ES_TOTP_SECRET    base32 TOTP secret          (SSL.com → eSigner → Automate)
