# Storeveu Support — branding + baked-config contract (Phase 1)
#
# Declarative source of truth consumed by the fork's build patch. The patch
# (version-locked against the pinned RUSTDESK_REF in the fork) maps each value
# below onto the corresponding RustDesk source constant / asset.

[identity]
app_name        = "Storeveu Support"
window_title    = "Storeveu Support"
company         = "Storeveu"
# Replace upstream RustDesk icons/logo with Storeveu assets in the fork:
#   ./branding/assets/icon.ico, logo.png  (added in the fork repo)

[server]                       # DEDICATED relay (74.208.69.12), addressed by hostname (v1.4.2+)
rendezvous      = "support.storeveu.com:443"
relay           = "support.storeveu.com:80"
public_key      = "xW7LgoDQ9p5FVQQbA35lzAAEQ03W0hpJRa4LE220eeU="
# 443 (rendezvous tcp+udp; NAT test derives :442) + 80 (relay) are ports strict
# store networks allow outbound, so v1.4.2+ agents need NO wstunnel wherever
# outbound UDP 443 passes. Hostname (not raw IP) so a future server move = a
# DNS edit, no agent re-ship. Server bootstrap: monorepo
# remote-support/server/setup-dedicated.sh <hostname>.
# Hard-coded so a store cannot repoint it and needs zero setup.
# (Legacy fleet <= v1.4.1: support-relay.storeveu.com + old key, untouched.)
allow_user_override = false

[access]                       # PCI: consent-only, no unattended access
permanent_password   = "disabled"   # never a static/baked password
require_accept_prompt = true         # on-site consent gate
one_time_code        = true          # generated on demand; POS-triggered in Phase 2
direct_ip_access     = false

[privacy]                      # PCI Req 3 — PAN/PIN never captured
# Phase 4 hardening, applied in the FORK build (RustDesk privacy mode /
# window-exclusion) — NOT implementable in the monorepo; the backend never
# sees pixels. The rebranded client must blackout the card-entry + PIN-pad
# window in BOTH the live stream and the recording. RustDesk supports a
# privacy/blackout mode + window exclusion; the fork's branding patch wires
# the POS card-entry window title/class into the exclusion list and forces
# privacy mode on while the tender/PIN surface is focused.
mask_card_entry_window = true
mask_in_recording      = true
# Backend retention: recordings are bounded by the Phase 3 per-store quota
# (10 GiB rolling-evict-oldest; audit row is KEPT, only media rolls off).
# A time-based auto-purge (e.g. delete media > N days) is a future add-on —
# the quota already bounds storage so it is not required for launch.

[deployment]
install_mode    = "windows-service"  # survives POS crash; separate from cashier app
autostart       = true
tray_ui         = "minimal"          # connect-code + accept/deny + active banner only
silent_install  = true               # bundled installer drops it; store does nothing

[license]
upstream        = "rustdesk/rustdesk"
spdx            = "AGPL-3.0-only"
source_offer    = "../SOURCE_OFFER.md"   # MUST ship in installer + About screen
